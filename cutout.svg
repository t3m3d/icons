<?xml version="1.0" encoding="UTF-8"?>
<!-- Cutout app icon. 1024×1024. White scissors on a magenta squircle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a0f3e" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <g filter="url(#sh)">
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <!-- blades (cross at the pivot) -->
      <line x1="582" y1="648" x2="372" y2="352" stroke-width="40"/>
      <line x1="442" y1="648" x2="652" y2="352" stroke-width="40"/>
      <!-- handle loops -->
      <circle cx="440" cy="708" r="58" stroke-width="36"/>
      <circle cx="584" cy="708" r="58" stroke-width="36"/>
    </g>
    <circle cx="512" cy="506" r="20" fill="#ffffff"/>
  </g>
</svg>
