<?xml version="1.0" encoding="UTF-8"?>
<!-- Meridian app icon. 1024×1024. White clock on an amber squircle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a3d00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <g filter="url(#sh)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-width="56"/>
    <g stroke="#ffffff" stroke-width="42" stroke-linecap="round">
      <line x1="512" y1="512" x2="356" y2="422"/>   <!-- hour hand (~10) -->
      <line x1="512" y1="512" x2="700" y2="404"/>   <!-- minute hand (~2) -->
    </g>
    <circle cx="512" cy="512" r="30" fill="#ffffff"/>
  </g>
</svg>
