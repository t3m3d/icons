<?xml version="1.0" encoding="UTF-8"?>
<!-- DevBar app icon. 1024×1024 master. Bold white { } on a blue squircle.
     Rasterize to PNGs with launch/icon → scripts/make-iconset.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5fd9"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <!-- braces -->
  <g fill="none" stroke="#ffffff" stroke-width="80" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#glyphShadow)">
    <!-- left brace { -->
    <path d="M 441,276
             C 370,276 370,347 370,418
             C 370,465 347,488 323,512
             C 347,536 370,557 370,606
             C 370,677 370,748 441,748"/>
    <!-- right brace } (mirror about x=512) -->
    <path d="M 583,276
             C 654,276 654,347 654,418
             C 654,465 677,488 701,512
             C 677,536 654,557 654,606
             C 654,677 654,748 583,748"/>
  </g>
</svg>
