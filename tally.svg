<?xml version="1.0" encoding="UTF-8"?>
<!-- Tally app icon. 1024×1024 master. Bold white "=" on a green squircle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064d24" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <!-- equals sign: two rounded bars -->
  <g fill="#ffffff" filter="url(#sh)">
    <rect x="300" y="430" width="424" height="74" rx="37"/>
    <rect x="300" y="566" width="424" height="74" rx="37"/>
  </g>
</svg>
